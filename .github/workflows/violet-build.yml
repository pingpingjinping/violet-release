name: CI
on:
  pull_request:
    branches:
      - "dev"
  push:
    branches:
      - "dev"
  merge_group:
  workflow_dispatch:

# Checkout needs contents:read, and paths-filter needs pull-requests:read.
# Apply to the change-detection and Flutter format/analyze jobs.
permissions:
  contents: read
  pull-requests: read

jobs:
  app-changes:
    runs-on: ubuntu-latest
    # Set job outputs to values from filter step
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

      # For pull requests it's not necessary to checkout the code
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # On a dev push, compare against the previous dev commit.
          base: ${{ github.event_name == 'push' && github.event.before || 'dev' }}
          filters: |
            src:      
              - ".github/workflows/violet-build.yml"
              - "violet/**"

  app-format:
    needs: app-changes
    if: ${{ needs.app-changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: violet
    steps:
      - uses: actions/checkout@v2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

      - uses: actions/setup-java@main
        with:
          distribution: "temurin"
          java-version: "17.x"

      - uses: subosito/flutter-action@v1
        with:
          channel: "stable"
          flutter-version: 3.35.4

      - uses: dtolnay/rust-toolchain@stable

      - name: Get Dart dependencies
        run: dart pub get

      # The dev branch has legacy formatting differences. Check only the
      # Dart files changed by this PR instead of failing on unrelated files.
      - name: Formatting (changed Dart files)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mapfile -t files < <(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --paginate --jq '.[].filename' \
              | grep -E '^violet/.*[.]dart$' | cut -c8- || true
          )
          if [ "${#files[@]}" -gt 0 ]; then
            dart format --output=none --set-exit-if-changed "${files[@]}"
          else
            echo "No Dart files changed in this PR."
          fi

      - name: Preprocess
        run: |
          cd lib/server
          wget -q ${{ secrets.SECRET_SALT }} || echo 'String getValid(String vToken) { return vToken; }' > salt.dart
          wget -q ${{ secrets.SECRET_WSALT }} || echo 'String getValid(String vToken) { return vToken; }' > wsalt.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

name: Bookmark sync checks

on:
  push:
    branches: ["codex/bookmark-sync"]
  pull_request:
    paths:
      - "mobile-db/**"
      - "tests/test_bookmark_sync.py"
      - "violet/lib/services/bookmark_sync.dart"
      - "violet/lib/pages/settings/bookmark_sync_page.dart"
      - "violet-web/packages/frontend/**"
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p test_bookmark_sync.py -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
        working-directory: violet-web
      - run: pnpm build
        working-directory: violet-web

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          cache: true
      - run: |
          flutter pub get
          printf '%s\n' 'String getValid(String vToken) { return vToken; }' > lib/server/salt.dart
          printf '%s\n' 'String getValid(String vToken) { return vToken; }' > lib/server/wsalt.dart
          dart format lib/services/bookmark_sync.dart lib/pages/settings/bookmark_sync_page.dart lib/pages/after_loading/afterloading_page.dart lib/pages/settings/settings_page.dart lib/pages/bookmark/bookmark_page.dart
          git diff -- lib > "$GITHUB_WORKSPACE/dart-format.patch"
          flutter analyze --no-fatal-infos lib/services/bookmark_sync.dart lib/pages/settings/bookmark_sync_page.dart
        working-directory: violet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dart-format
          path: dart-format.patch

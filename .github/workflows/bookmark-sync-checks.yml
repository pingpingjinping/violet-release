name: Bookmark sync checks

on:
  push:
    branches: ["codex/bookmark-sync", "codex/activity-sync"]
  pull_request:
    paths:
      - "violet/lib/services/download*.dart"
      - "violet/lib/pages/download/**"
      - "violet/lib/downloader/**"
      - "violet/ios/Runner/AppDelegate.swift"
      - "violet/android/app/src/main/kotlin/xyz/project/violet/MainActivity.kt"
      - "violet/test/download_service_test.dart"
      - "mobile-db/**"
      - "tests/**"
      - "violet/lib/services/bookmark_sync.dart"
      - "violet/lib/services/content_db_sync.dart"
      - "violet/lib/pages/after_loading/afterloading_page.dart"
      - "violet/lib/pages/database_download/database_download_page.dart"
      - "violet/lib/pages/settings/bookmark_sync_page.dart"
      - "violet-web/packages/frontend/**"
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p 'test_*sync.py' -v
      - run: python -m unittest discover -s tests -p 'test_content_snapshot.py' -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
        working-directory: violet-web
      - run: pnpm build
        working-directory: violet-web
      - run: npm install --prefix /tmp/violet-client-tests esbuild fake-indexeddb
      - run: node tests/test_activity_client.cjs
        env:
          VIOLET_TEST_MODULES: /tmp/violet-client-tests/node_modules

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          cache: true
      - run: |
          flutter pub get
          printf '%s\n' 'String getValid(String vToken) { return vToken; }' > lib/server/salt.dart
          printf '%s\n' 'String getValid(String vToken) { return vToken; }' > lib/server/wsalt.dart
          dart format lib/downloader/isolate/core.dart lib/services/download_service.dart lib/services/download_work_queue.dart lib/pages/download/download_item_widget.dart lib/pages/download/download_routine.dart lib/downloader/isolate_downloader.dart test/download_service_test.dart lib/services/server_config.dart lib/services/backup_codec.dart lib/services/pi_backup.dart lib/pages/settings/server_settings_page.dart lib/pages/settings/pi_backup_page.dart lib/server/violet.dart lib/server/violet_v2.dart lib/version/sync.dart lib/pages/community/user_status_card.dart test/server_backup_test.dart lib/pages/splash/splash_page.dart lib/component/index.dart lib/pages/artist_info/artist_info_page.dart lib/widgets/article_item/thumbnail.dart lib/widgets/article_item/article_list_item_widget_controller.dart test/startup_activity_test.dart lib/services/content_db_sync.dart lib/pages/database_download/database_download_page.dart lib/services/activity_sync.dart lib/widgets/shared_activity_badge.dart lib/widgets/article_item/article_list_item_widget.dart lib/pages/settings/shared_activity_page.dart lib/pages/article_info/article_info_page.dart lib/pages/download/download_page.dart lib/database/user/record.dart lib/pages/bookmark/record_view_page.dart lib/pages/viewer/viewer_page.dart lib/services/bookmark_sync.dart lib/pages/settings/bookmark_sync_page.dart lib/pages/after_loading/afterloading_page.dart lib/pages/settings/settings_page.dart lib/pages/settings/image_cache_page.dart lib/pages/bookmark/bookmark_page.dart
          git diff -- lib test > "$GITHUB_WORKSPACE/dart-format.patch"
          flutter analyze --no-fatal-infos lib/services/download_service.dart lib/services/download_work_queue.dart lib/pages/download/download_item_widget.dart lib/pages/download/download_routine.dart lib/downloader/isolate_downloader.dart test/download_service_test.dart lib/services/server_config.dart lib/services/backup_codec.dart lib/services/pi_backup.dart lib/pages/settings/server_settings_page.dart lib/pages/settings/pi_backup_page.dart lib/server/violet.dart lib/server/violet_v2.dart lib/version/sync.dart lib/pages/community/user_status_card.dart test/server_backup_test.dart lib/pages/splash/splash_page.dart lib/component/index.dart lib/pages/artist_info/artist_info_page.dart lib/widgets/article_item/thumbnail.dart lib/widgets/article_item/article_list_item_widget_controller.dart test/startup_activity_test.dart lib/services/content_db_sync.dart lib/pages/after_loading/afterloading_page.dart lib/pages/database_download/database_download_page.dart lib/services/activity_sync.dart lib/services/bookmark_sync.dart lib/widgets/shared_activity_badge.dart lib/widgets/article_item/article_list_item_widget.dart lib/pages/settings/shared_activity_page.dart lib/pages/settings/bookmark_sync_page.dart lib/pages/article_info/article_info_page.dart lib/pages/download/download_page.dart lib/database/user/record.dart lib/pages/bookmark/record_view_page.dart lib/pages/viewer/viewer_page.dart
          flutter test test/startup_activity_test.dart test/server_backup_test.dart test/download_service_test.dart
        working-directory: violet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dart-format
          path: dart-format.patch

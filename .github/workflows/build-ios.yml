name: Build iOS IPA

# Build automatically when app changes reach dev; manual releases
# remain available through workflow_dispatch.
permissions:
  contents: write

on:
  push:
    branches: ["dev"]
    paths:
      - "violet/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          for xcode_path in \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode_16.2.app \
            /Applications/Xcode_16.1.app; do
            if [ -d "$xcode_path" ]; then
              sudo xcode-select -s "$xcode_path/Contents/Developer"
              xcodebuild -version
              exit 0
            fi
          done
          echo "Xcode 16 was not found."
          exit 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          cache: true

      - name: Set up Rust and iOS targets
        run: |
          mkdir -p ~/.rustup/downloads
          rustup default stable
          rustup target add \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios

      # These caches live in GitHub Actions' cache storage, separately from IPA releases.
      # Keep DerivedData caching restricted to Cargokit's Rust target, not the
      # entire Xcode build directory (which is much larger and often misses).
      - name: Record compiler versions for cache keys
        id: compiler-versions
        run: |
          echo "xcode=$(xcodebuild -version | awk '/^Xcode / {print $2}')" >> "$GITHUB_OUTPUT"
          echo "rust=$(rustc --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore CocoaPods cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            violet/ios/Pods
          key: ios-pods-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('violet/ios/Podfile.lock', 'violet/pubspec.lock') }}-v1
          restore-keys: |
            ios-pods-${{ runner.os }}-${{ runner.arch }}-

      # Cargokit passes Xcode's TARGET_TEMP_DIR to cargo --target-dir;
      # violet/rust/target is therefore NOT where iOS Rust builds are saved.
      - name: Restore iOS Rust dependency and compilation cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            violet/build/DerivedData/Build/Intermediates.noindex/Pods.build/Release-iphoneos/rust_lib_violet.build
          key: ios-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler-versions.outputs.xcode }}-${{ steps.compiler-versions.outputs.rust }}-${{ hashFiles('violet/rust/Cargo.lock') }}-v1
          restore-keys: |
            ios-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler-versions.outputs.xcode }}-${{ steps.compiler-versions.outputs.rust }}-

      - name: Prepare fallback salt files
        working-directory: violet
        run: |
          mkdir -p lib/server

          if [ ! -f lib/server/salt.dart ]; then
            printf '%s\n' \
              'String getValid(String vToken) { return vToken; }' \
              > lib/server/salt.dart
          fi

          if [ ! -f lib/server/wsalt.dart ]; then
            printf '%s\n' \
              'String getValid(String vToken) { return vToken; }' \
              > lib/server/wsalt.dart
          fi

      - name: Prepare Flutter and CocoaPods
        working-directory: violet
        run: |
          flutter pub get
          flutter build ios --config-only --release --no-codesign
          cd ios
          pod install

      - name: Build iOS app without code signing
        working-directory: violet/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ../build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Package IPA
        working-directory: violet
        run: |
          APP_DIR="build/DerivedData/Build/Products/Release-iphoneos/Runner.app"

          if [ ! -d "$APP_DIR" ]; then
            echo "Runner.app was not found."
            exit 1
          fi

          mkdir -p build/ipa/Payload
          ditto "$APP_DIR" build/ipa/Payload/Runner.app

          cd build/ipa
          zip -r -y "$GITHUB_WORKSPACE/violet.ipa" Payload

      # Compiling and zipping succeeded previously, but upload-artifact
      # failed because the repository's Actions artifact quota was exhausted.
      # Use a private-repository GitHub Release asset instead. Release assets
      # do not consume the GitHub Actions artifact storage quota.
      - name: Publish IPA to GitHub Releases
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/dev' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s violet.ipa
          tag="ios-${GITHUB_REF_NAME}-latest"
          title="Violet iOS (${GITHUB_REF_NAME} latest)"
          notes="Unsigned development IPA built from commit ${GITHUB_SHA} (run ${GITHUB_RUN_ID})."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" violet.ipa --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" violet.ipa \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --prerelease
          fi
          echo "IPA: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"

      # xcodebuild already streams its full output to the job log. Avoid
      # upload-artifact for build logs while the Actions quota is exhausted.

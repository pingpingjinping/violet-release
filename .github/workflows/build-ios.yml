name: Build iOS IPA

on:
  push:
    branches: ["dev", "main", "master"]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          for xcode_path in \
            /Applications/Xcode_16.0.app \
            /Applications/Xcode_16.1.app \
            /Applications/Xcode_16.app; do
            if [ -d "$xcode_path" ]; then
              sudo xcode-select -s "$xcode_path/Contents/Developer"
              xcodebuild -version
              exit 0
            fi
          done
          echo "Xcode 16 was not found."
          exit 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          cache: true

      - name: Set up Rust and iOS targets
        run: |
          mkdir -p ~/.rustup/downloads
          rustup default stable
          rustup target add \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios

      - name: Prepare Flutter and CocoaPods
        working-directory: violet
        run: |
          flutter pub get
          flutter build ios --config-only --release --no-codesign
          cd ios
          pod install

      - name: Build iOS app without code signing
        working-directory: violet/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ../build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Package IPA
        working-directory: violet
        run: |
          APP_DIR="build/DerivedData/Build/Products/Release-iphoneos/Runner.app"

          if [ ! -d "$APP_DIR" ]; then
            echo "Runner.app was not found."
            exit 1
          fi

          mkdir -p build/ipa/Payload
          ditto "$APP_DIR" build/ipa/Payload/Runner.app

          cd build/ipa
          zip -r "$GITHUB_WORKSPACE/violet.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: violet-custom-ipa
          path: violet.ipa
          if-no-files-found: error

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
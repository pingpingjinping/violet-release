name: Build iOS IPA

on:
  push:
    branches: [ "dev", "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Fix Rustup and Install iOS Targets
        run: |
          mkdir -p ~/.rustup/downloads
          rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Install Flutter & Pod dependencies
        working-directory: violet
        run: |
          flutter pub get
          cd ios
          pod install

      - name: Build Xcode Workspace directly (No Codesign)
        working-directory: violet/ios
        run: |
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ../build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Payload to IPA
        working-directory: violet
        run: |
          APP_DIR=$(find build/DerivedData/Build/Products/Release-iphoneos -name "Runner.app" -type d | head -n 1)
          mkdir Payload
          cp -r "$APP_DIR" Payload/
          zip -r violet.ipa Payload
          mv violet.ipa $GITHUB_WORKSPACE/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: violet-custom-ipa
          path: violet.ipa
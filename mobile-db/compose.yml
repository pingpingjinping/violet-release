services:
  db-download:
    image: python:3.12-alpine
    working_dir: /app
    command: ["python", "-u", "server.py"]
    ports:
      - "3002:3002"
    volumes:
      - ./server.py:/app/server.py:ro
      - ./bookmark_sync.py:/app/bookmark_sync.py:ro
      - ./activity_sync.py:/app/activity_sync.py:ro
      - ./backup_store.py:/app/backup_store.py:ro
      - ./export:/export
      - ./state:/state
      - content-db:/content-data
    mem_limit: 128m
    restart: unless-stopped

volumes:
  content-db:
    external: true
    name: violet_violet-content-db
